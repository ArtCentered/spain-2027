<style>
  :root{ --teal:#1F4E5F; --teal2:#2C7A8C; --terra:#C1660F; --sea:#2C7A8C; --gold:#C8902F; --eclipse:#4b2a8a;
    --sand:#FBF6EE; --ink:#243239; --muted:#6b7a80; --hike:#2E7D32; --line:#ece3d4;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); }
  *{box-sizing:border-box;}
  button{-webkit-tap-highlight-color:transparent;font-family:inherit;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f4f1ea;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  .topbar{background:var(--teal);color:#fff;padding:calc(8px + var(--safe-t)) 16px 9px;flex:0 0 auto;display:flex;align-items:center;gap:9px;box-shadow:0 1px 0 rgba(0,0,0,.1);}
  .topbar .brand{font-size:16px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .ctx{margin-left:auto;font-size:11.5px;opacity:.82;text-align:right;line-height:1.25;}
  .topbar .back{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:8px;font-size:13px;padding:6px 10px;cursor:pointer;display:none;}
  .topbar.has-back .back{display:inline-block;} .topbar.has-back .ctx{display:none;}

  #views{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;}
  .view.active{display:block;} #view-map{overflow:hidden;}
  .scrollpad{padding:14px 14px calc(20px + var(--safe-b));}

  .tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b);box-shadow:0 -2px 12px rgba(0,0,0,.06);}
  .tabbar button{flex:1;background:none;border:none;padding:8px 0 7px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;}
  .tabbar button .ti{font-size:21px;line-height:1;} .tabbar button.active{color:var(--teal);}

  .listhead{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:2px 2px 10px;}
  .dayrow{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:9px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;}
  .dayrow .thumb{width:96px;height:76px;border-radius:11px;object-fit:cover;flex:0 0 auto;background:#dfe6e6;display:flex;align-items:center;justify-content:center;font-size:30px;}
  .dayrow .meta{min-width:0;flex:1;}
  .dayrow .dnum{font-size:11px;color:var(--terra);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .dayrow h3{margin:1px 0 3px;font-size:15.5px;color:var(--teal);line-height:1.15;}
  .dayrow .subttl{font-size:11.5px;color:var(--muted);margin:0 0 4px;}
  .dayrow .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.2px;}
  .dayrow .arrow{margin-left:auto;color:#c4cccd;font-size:20px;flex:0 0 auto;}

  .dayhero{position:relative;height:230px;background:#13232a;overflow:hidden;}
  .dayhero img{width:100%;height:100%;object-fit:cover;display:block;}
  .dayhero .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,22,28,.85),rgba(10,22,28,.15) 60%);}
  .dayhero .cap{position:absolute;left:16px;right:16px;bottom:12px;color:#fff;}
  .dayhero .cap .d{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.92;}
  .dayhero .cap h2{margin:2px 0 0;font-size:23px;line-height:1.12;text-shadow:0 1px 6px rgba(0,0,0,.4);}
  .dayhero .cap .subt{font-size:12.5px;opacity:.92;margin-top:2px;text-shadow:0 1px 5px rgba(0,0,0,.5);}
  .daysum{font-size:13.5px;line-height:1.5;color:var(--ink);padding:13px 16px 4px;}
  .timeline{padding:6px 14px calc(24px + var(--safe-b));position:relative;}
  .event{position:relative;padding-left:30px;padding-bottom:14px;}
  .event::before{content:"";position:absolute;left:9px;top:5px;bottom:-6px;width:2px;background:var(--line);}
  .event:last-child::before{display:none;}
  .event .dot{position:absolute;left:2px;top:3px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .event .etime{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .ecard{background:#fff;border-radius:13px;box-shadow:0 2px 8px rgba(0,0,0,.07);overflow:hidden;}
  .ecard .egal{position:relative;height:215px;background:#13232a;}
  .ecard .egal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;pointer-events:none;}
  .ecard .egal img.active{opacity:1;pointer-events:auto;cursor:zoom-in;}
  .egal .gnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;}
  .egal .gnav.prev{left:7px;} .egal .gnav.next{right:7px;}
  .egal .gdots{position:absolute;bottom:7px;left:0;right:0;display:flex;gap:5px;justify-content:center;pointer-events:none;}
  .egal .gdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);} .egal .gdot.active{background:#fff;}
  .egal .gexp{position:absolute;bottom:7px;right:7px;background:rgba(0,0,0,.5);color:#fff;border-radius:6px;font-size:11px;padding:3px 7px;cursor:zoom-in;}
  .ebody{padding:11px 13px 12px;}
  .ebody h3{margin:0 0 2px;font-size:15.5px;color:var(--teal);line-height:1.2;display:flex;align-items:center;gap:7px;}
  .ebody h3 .eic{font-size:16px;}
  .ebody .edesc{font-size:13px;line-height:1.45;color:var(--ink);margin:5px 0 0;}
  .erow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .erow a, .erow .bk{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:8px;padding:5px 9px;text-decoration:none;}
  .erow a.map{background:#e9f1f2;color:var(--teal);} .erow a.web{background:var(--teal);color:#fff;}
  .erow .bk{background:#fbf3e7;color:#9a5a12;} .erow .bk.todo{background:#fdeede;color:#b4540f;}
  .erow .cost{background:#f1ece2;color:var(--terra);}
  .enote{background:#fff7ed;border:1px solid #f3dcc0;color:#7a4a12;border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.4;margin-top:9px;}

  .todaybanner{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-radius:15px;padding:16px 17px;margin-bottom:12px;}
  .todaybanner.ecl{background:linear-gradient(135deg,#2b1a52,var(--eclipse));}
  .todaybanner .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;opacity:.85;font-weight:700;}
  .todaybanner h2{margin:4px 0 5px;font-size:24px;}
  .todaybanner p{margin:0;font-size:13px;opacity:.92;line-height:1.45;}
  .todaybanner .big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:2px 0;font-variant-numeric:tabular-nums;}
  .ecl-tl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin-top:8px;}
  .ecl-tl b{font-variant-numeric:tabular-nums;} .ecl-tl .now{color:#ffd66b;font-weight:800;}
  .bwrap{background:#fff;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:13px 15px;margin-bottom:12px;}
  .bwrap h3{margin:0 0 8px;font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;}
  .bwrap h3 .amt{color:var(--terra);}
  .bbar{height:14px;border-radius:999px;background:#efe9dc;overflow:hidden;position:relative;}
  .bbar .proj{position:absolute;inset:0 auto 0 0;background:#e8d9b8;}
  .bbar .paid{position:absolute;inset:0 auto 0 0;background:var(--terra);}
  .bleg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:7px;flex-wrap:wrap;}
  .bleg b{color:var(--ink);} .bleg .dotl{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px;}
  .btable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  .btable td{padding:5px 4px;border-top:1px solid #f3eee2;vertical-align:top;}
  .btable td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .bst{display:inline-block;font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 5px;letter-spacing:.3px;}
  .bst.paid{background:#e9f5ea;color:#2E7D32;} .bst.estimate{background:#eef0f1;color:#5b6b71;} .bst.booked{background:#fff3d9;color:#9a5a12;}
  .todoitem{display:flex;gap:9px;padding:8px 0;border-top:1px solid #f3eee2;} .todoitem:first-of-type{border-top:none;}
  .todoitem .cb{flex:0 0 auto;font-size:17px;color:var(--terra);line-height:1.15;}
  .todoitem b{color:var(--teal);font-size:13px;} .when{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.35;}

  #map{position:absolute;inset:0;}
  .legend{position:absolute;left:10px;bottom:calc(10px + var(--safe-b));z-index:500;background:rgba(255,255,255,.94);border-radius:10px;padding:7px 10px;font-size:11px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.2);}
  .legend .lg{display:inline-block;width:18px;height:0;vertical-align:middle;margin-right:4px;}
  .legend .lg.fly{border-top:3px dashed #6b7a80;} .legend .lg.train{border-top:3px solid #1F4E5F;} .legend .lg.bus{border-top:3px solid #2E7D32;} .legend .lg.ecl{border-top:3px solid #4b2a8a;}
  .pin{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;width:30px;height:30px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #fff;cursor:pointer;}
  .pin.base{width:34px;height:34px;font-size:15px;}
  .pin.small{width:20px;height:20px;font-size:10px;opacity:.9;}

  .infocard{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:13px 15px;margin-bottom:11px;}
  .infocard h3{margin:0 0 7px;font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:.4px;}
  .inforow{display:flex;gap:9px;padding:6px 0;font-size:13px;line-height:1.45;border-top:1px solid #f3eee2;} .inforow:first-of-type{border-top:none;}
  .inforow .ii{flex:0 0 auto;font-size:15px;} .inforow b{color:var(--teal);} .inforow .todo{color:var(--terra);font-weight:600;} .inforow a{color:var(--teal);font-weight:600;}
  .tiny{font-size:11.5px;color:var(--muted);text-align:center;margin:6px 0 2px;line-height:1.6;} .tiny a{color:var(--muted);}

  /* stays */
  .stayblock h3{margin:14px 2px 4px;font-size:15px;color:var(--teal);}
  .stayblock .why{font-size:12.5px;color:#3a4a52;margin:0 2px 8px;line-height:1.45;}
  .stay{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;}
  .stay .ph{width:84px;height:70px;border-radius:8px;flex:0 0 auto;background:linear-gradient(135deg,#efe6d6,#dccdb4);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
  .stay .ph img{width:100%;height:100%;object-fit:cover;}
  .stay .b{flex:1;min-width:0;} .stay h4{margin:0;font-size:14px;} .stay .area{font-size:12px;color:var(--teal2);font-weight:600;}
  .stay p{margin:3px 0 0;font-size:12.5px;line-height:1.4;color:#3a4a52;} .band{float:right;font-size:12px;font-weight:800;color:var(--terra);}
  .st{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:4px;}
  .st.pick{background:#efeafa;color:var(--eclipse);} .st.ok{background:#e9f5ea;color:#2E7D32;} .st.unk{background:#eef0f1;color:#5b6b71;} .st.booked{background:#e9f5ea;color:#2E7D32;}
  .links{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;}
  .links a{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-size:11.5px;font-weight:700;border-radius:7px;padding:5px 9px;}
  .links a.alt{background:#eef0f1;color:var(--teal);}

  .lightbox{position:fixed;inset:0;z-index:1400;background:rgba(8,12,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .lightbox.show{opacity:1;pointer-events:auto;}
  .lb-img{max-width:94vw;max-height:78vh;object-fit:contain;border-radius:8px;box-shadow:0 12px 50px rgba(0,0,0,.6);}
  .lb-cap{color:#fff;margin-top:14px;font-size:15px;text-align:center;max-width:92vw;padding:0 14px;line-height:1.35;}
  .lb-cap .lb-count{display:block;font-size:12px;color:rgba(255,255,255,.55);margin-top:5px;letter-spacing:.5px;}
  .lb-x{position:absolute;top:calc(14px + var(--safe-t));right:16px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer;}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:26px;cursor:pointer;}
  .lb-nav.prev{left:8px;} .lb-nav.next{right:8px;}
</style>

function P(day,slug){ return `photos/trip/day-${String(day).padStart(2,'0')}/${slug}.jpg`; }
function mapU(q){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q); }

 { n:0, nick:"The long haul", iso:"2027-07-31", date:"Sat 31 Jul", title:"Depart Eugene", place:"Eugene → Europe", ll:EUG, chips:[["Travel","#6b7a80"]],

    { ic:"🌍", cat:"move", time:"Sat 13:30 · SEA", title:"Transatlantic overnight", place:"SEA → LHR (BA52) or PDX → AMS (KLM)", mapq:"London Heathrow", desc:"BA52 lands LHR 06:45 Sun; KL616 lands AMS 07:55 Sun. This is the sleep that protects Sunday — premium economy is worth pricing (~$2.3–3.5k pp peak)." },
   ]},
 { n:1, nick:"Beach before the shadow", iso:"2027-08-01", date:"Sun 1 Aug", title:"Land Málaga → Fuengirola beachfront", place:"Fuengirola · Los Boliches promenade", ll:[36.5450,-4.6150], chips:[["Eclipse eve","#4b2a8a"],["Travel","#6b7a80"]],
   summary:"Land ~11:00–14:00 and ride the Cercanías C-1 straight from under the terminal to Fuengirola (33 min) — the airport is on the eclipse line. Check into a beachfront hotel on the Los Boliches promenade, stand on the sand and look ESE: that's tomorrow's spot, no train needed. Swim, espetos, early bed.",

    { ic:"🚆", cat:"train", time:"~13:00", title:"Cercanías C-1 airport → Fuengirola", place:"Aeropuerto → Fuengirola terminus, 33 min, every 20 min", mapq:"Estación de Fuengirola", desc:"~€2.70. Buy/load a Cercanías card at the machine — you'll use it again tomorrow. Ride to the END of the line: the Fuengirola terminus is ~8 min from Jomarijo. Taxi alternative ~€40, 25 min.", photos:[cap(1,'c1',"The C-1")] },

    { ic:"🍤", cat:"food", time:"20:00", title:"Espetos + early bed", place:"A chiringuito on the promenade", mapq:"chiringuito Los Boliches Fuengirola", desc:"Grilled sardines on the beach, a caña, bed by 22:00. Jet lag makes tomorrow's start easy.", photos:[cap(1,'espetos',"Espetos")] },

    { ic:"⏰", cat:"rest", time:"07:30", title:"Café breakfast, check out, bags to the hotel's hold", place:"Jomarijo → a promenade café", desc:"Checkout is 11:00 and the partial runs to 12:02 — so check out and hand the bags over BEFORE walking to the beach (~08:30), collect them after lunch. Water 2–3 L each, hats, shade, eclipse glasses ×4, iPad in a sand-proof bag. The Costa del Sol is the sheltered side of the path — marine fog is rare; a Levante just means clear and breezy." },

/* ---------- eclipse clock (Fuengirola, CEST = UTC+2) ---------- */
const ECL=[ ["First contact (partial begins)","2027-08-02T07:41:43Z"],["TOTALITY begins — glasses off","2027-08-02T08:47:03Z"],["Maximum","2027-08-02T08:48:38Z"],["Totality ends — glasses on","2027-08-02T08:50:13Z"],["Last contact","2027-08-02T10:02:09Z"] ];
const T2=new Date("2027-08-02T08:47:03Z");
function fmtCEST(iso){ return new Date(iso).toLocaleTimeString('en-GB',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function dhms(ms){ const s=Math.max(0,Math.floor(ms/1000)); const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60; return d>0?`${d}d ${h}h ${m}m`:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }
function eclipseCardHTML(){
  const now=new Date(); const to=T2-now; let head, big;
  if(to>0){ head="Countdown to totality · Fuengirola"; big=dhms(to); }
  else if(now<new Date("2027-08-02T08:50:13Z")){ head="TOTALITY — NOW"; big=dhms(new Date("2027-08-02T08:50:13Z")-now)+" left"; }
  else { head="Eclipse of 2 Aug 2027"; big="✓ seen"; }
  const idx=ECL.findIndex(([,t])=>new Date(t)>now);
  const tl=ECL.map(([l,t],i)=>`<b class="${i===idx-1?'now':''}">${fmtCEST(t)}</b><span class="${i===idx-1?'now':''}">${l}</span>`).join('');
  return `<div class="todaybanner ecl"><div class="lbl">${head}</div><div class="big" id="eclBig">${big}</div><p>Mon 2 Aug 2027 · Fuengirola beach (Cercanías C-1 from Málaga, 45 min) · 3 m 10 s · Sun ~38° up, ESE. Málaga city: 10:48:02–10:49:51 (1 m 49 s).</p><div class="ecl-tl">${tl}</div></div>`;
}
let eclTimer=null;
function startEclClock(){ if(eclTimer) clearInterval(eclTimer); eclTimer=setInterval(()=>{ const el=document.getElementById('eclBig'); if(!el){clearInterval(eclTimer);return;} const to=T2-new Date(); el.textContent= to>0? dhms(to) : (new Date()<new Date("2027-08-02T08:50:13Z")? dhms(new Date("2027-08-02T08:50:13Z")-new Date())+" left":"✓ seen"); },1000); }

function galHTML(photos){
  if(!photos||!photos.length) return '';
  const multi=photos.length>1;
  const imgs=photos.map((src,j)=>`<img class="${j===0?'active':''}" src="${src}" alt="" loading="lazy" onerror="this.closest('.egal').remove()" onclick="openLb(this)">`).join('');
  const dots=multi?`<div class="gdots">${photos.map((_,j)=>`<span class="gdot ${j===0?'active':''}"></span>`).join('')}</div>`:'';
  const nav=multi?`<button class="gnav prev" onclick="galShift(this,-1)">‹</button><button class="gnav next" onclick="galShift(this,1)">›</button>`:'';
  return `<div class="egal">${imgs}${nav}<span class="gexp" onclick="openLb(this)">⤢</span>${dots}</div>`;
}
function eventHTML(e){
  const mp = e.mapq ? `<a class="map" href="${mapU(e.mapq)}" target="_blank" rel="noopener">📍 ${e.place||'Map'}</a>` : (e.place?`<span class="bk" style="background:#eef3f4;color:#1F4E5F">📍 ${e.place}</span>`:'');
  const book=(e.book||[]).map(b=>`<span class="bk ${/add |reserve|book|decide/i.test(b[1])?'todo':''}">📋 ${b[0]}: ${b[1]}</span>`).join('');
  const note=e.note?`<div class="enote">${e.note}</div>`:'';
  const rows=(mp||book)?`<div class="erow">${mp}${book}</div>`:'';
  return `<div class="event"><span class="dot" style="background:${CAT[e.cat].c}"></span><div class="etime">${e.time||''}</div>
    <div class="ecard">${galHTML(e.photos)}<div class="ebody"><h3><span class="eic">${e.ic}</span>${e.title}</h3>${e.desc?`<div class="edesc">${e.desc}</div>`:''}${rows}${note}</div></div></div>`;
}
function renderDayDetail(target,i){
  const d=DAYS[i]; const hero=heroOf(d);
  if(target==='itin-body') document.getElementById('itin-body').classList.remove('scrollpad');
  document.getElementById('topbar').classList.toggle('has-back', curTab==='itinerary');
  document.getElementById(target).innerHTML=
    `<div class="dayhero" style="background:${d.n===2?'#2b1a52':'#13232a'}"><img src="${hero}" alt="" onerror="this.remove()"><div class="grad"></div><div class="cap"><div class="d">Day ${d.n} · ${d.date}</div><h2>${d.nick}</h2><div class="subt">${d.title} · 📍 ${d.place}</div></div></div>`+
    (d.n===2?`<div style="padding:12px 14px 0">${eclipseCardHTML()}</div>`:'')+
    `<div class="daysum">${d.summary}</div><div class="timeline">${d.events.map(eventHTML).join('')}</div>`;
  if(d.n===2) startEclClock();
}
function galShift(btn,dir){ const g=btn.closest('.egal'); const im=[...g.querySelectorAll('img')]; const dt=[...g.querySelectorAll('.gdot')];
  let i=im.findIndex(x=>x.classList.contains('active')); im[i].classList.remove('active'); if(dt[i])dt[i].classList.remove('active');
  i=(i+dir+im.length)%im.length; im[i].classList.add('active'); if(dt[i])dt[i].classList.add('active'); }

function budgetCardHTML(){
  if(!window.budgetCalc) return '';
  const b=budgetCalc(); const B=window.TRIP_BUDGET;
  const cats={}; b.rows.forEach(r=>{(cats[r.cat]=cats[r.cat]||[]).push(r)});

  for(const c in cats){
    const sub=cats[c].reduce((a,r)=>a+r.usdVal,0);
    rows+=`<tr><td colspan="2" style="border-top:2px solid #e8e0cf"><b>${c}</b> · ${fmt$(sub)}</td></tr>`;
    rows+=cats[c].map(r=>`<tr><td>${r.name} <span class="bst ${r.status}">${r.status.toUpperCase()}</span></td><td class="r">${r.eur!=null?('€'+r.eur.toLocaleString()+' · '):''}${fmt$(r.usdVal)}</td></tr>`).join('');
  }
  return `<div class="bwrap"><h3><span>💶 Budget — full breakdown</span><span class="amt">${fmt$(b.total)} cap</span></h3>
    ${budgetBarHTML().replace('<div class="bwrap">','<div>').replace(/<h3>.*?<\/h3>/,'')}
    <table class="btable">${rows}
    <tr><td style="border-top:2px solid #e8e0cf"><b>Projected total</b></td><td class="r" style="border-top:2px solid #e8e0cf"><b>${fmt$(b.projected)}</b></td></tr>

/* ---------- lightbox ---------- */
let lbIdx=0;
function activeSrc(el){ const g=el.closest('.egal'); const a=g.querySelector('img.active'); return (a||g.querySelector('img'))?.getAttribute('src'); }
function openLb(el){ const src=activeSrc(el); const gi=ALL_PHOTOS.findIndex(p=>p.src===src); lbIdx=gi<0?0:gi; renderLb(); document.getElementById('lightbox').classList.add('show'); }
function renderLb(){ const it=ALL_PHOTOS[lbIdx]; if(!it)return; document.getElementById('lbImg').src=it.src; document.getElementById('lbCap').innerHTML=`Day ${it.n} · ${CAPS[it.src]||''}<span class="lb-count">${lbIdx+1} / ${ALL_PHOTOS.length}</span>`; }
function lbStep(d){ const n=ALL_PHOTOS.length; lbIdx=(lbIdx+d+n)%n; renderLb(); }
function closeLb(){ document.getElementById('lightbox').classList.remove('show'); }
function lbBackdrop(e){ if(e.target.id==='lightbox') closeLb(); }
document.addEventListener('keydown',e=>{ const lb=document.getElementById('lightbox'); if(lb.classList.contains('show')){ if(e.key==='ArrowRight')lbStep(1); else if(e.key==='ArrowLeft')lbStep(-1); else if(e.key==='Escape')closeLb(); } });
