<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spain 2027 — Eclipse at Tarifa → Basque Country</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{ --teal:#1F4E5F; --teal2:#2C7A8C; --terra:#C1660F; --gold:#C8902F; --sand:#FBF6EE; --ink:#243239;
    --muted:#6b7a80; --line:#ece3d4; --bg:#f4f1ea; --hike:#2E7D32; --night:#2b2340; --eclipse:#4b2a8a; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  a{color:var(--teal2);}
  button{font-family:inherit;cursor:pointer;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  header{background:var(--teal);color:#fff;padding:12px 18px 0;flex:0 0 auto;}
  header .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  header h1{margin:0;font-size:19px;letter-spacing:.2px;}
  header .sub{font-size:12.5px;opacity:.85;}
  nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;}
  nav.tabs button{background:transparent;border:none;color:#fff;opacity:.72;padding:8px 12px;font-size:13.5px;font-weight:600;
    border-bottom:3px solid transparent;white-space:nowrap;}
  nav.tabs button.active{opacity:1;border-bottom-color:var(--gold);}
  #main{flex:1 1 auto;min-height:0;display:flex;}
  #left{flex:0 0 46%;max-width:620px;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 60px;}
  #right{flex:1 1 auto;position:relative;min-width:0;}
  #map{position:absolute;inset:0;}
  .mapbtn{display:none;}
  @media (max-width:860px){
    #main{flex-direction:column;}
    #left{flex:1 1 auto;max-width:none;}
    #right{flex:0 0 0;height:0;}
    #right.open{flex:0 0 42vh;height:42vh;}
    .mapbtn{display:inline-block;position:fixed;right:14px;bottom:14px;z-index:1200;background:var(--terra);color:#fff;border:none;
      border-radius:999px;padding:11px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  }
  .view{display:none;} .view.active{display:block;}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 2px 8px;font-weight:700;}
  .note{background:#fff8ea;border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:13.5px;line-height:1.5;margin:0 0 12px;}
  .note.red{background:#fdeeea;border-left-color:#c0392b;}
  .note.purple{background:#efeafa;border-left-color:var(--eclipse);}

  /* day cards */
  .day{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden;border:1px solid transparent;}
  .day.sel{border-color:var(--terra);}
  .dayhead{display:flex;gap:12px;align-items:center;padding:11px 13px;cursor:pointer;}
  .dayhead .num{width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto;}
  .dayhead .meta{flex:1;min-width:0;}
  .dayhead .d{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--terra);}
  .dayhead h3{margin:1px 0 2px;font-size:15.5px;color:var(--teal);line-height:1.15;}
  .dayhead .base{font-size:12px;color:var(--muted);}
  .dayhead .chev{color:#c4cccd;font-size:18px;transition:transform .2s;}
  .day.open .dayhead .chev{transform:rotate(90deg);}
  .daybody{display:none;padding:0 13px 12px;}
  .day.open .daybody{display:block;}
  .daysum{font-size:13.5px;line-height:1.5;margin:0 0 10px;color:#3a4a52;}
  .ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;}
  .ev:hover{background:#faf7f0;}
  .ev .ph{width:76px;height:64px;border-radius:9px;flex:0 0 auto;background:linear-gradient(135deg,#dfe6e6,#c9d6d8);display:flex;align-items:center;justify-content:center;
    font-size:26px;overflow:hidden;position:relative;}
  .ev .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .ev .ph .add{position:absolute;inset:auto 0 0 0;background:rgba(31,78,95,.75);color:#fff;font-size:8.5px;text-align:center;padding:2px 3px;line-height:1.1;}
  .ev .body{flex:1;min-width:0;}
  .ev .t{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .ev h4{margin:1px 0 2px;font-size:14px;color:var(--ink);}
  .ev .pl{font-size:12px;color:var(--teal2);font-weight:600;}
  .ev p{margin:3px 0 0;font-size:12.5px;line-height:1.45;color:#3a4a52;}
  .ev .cost{display:inline-block;background:#f1ece2;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;color:var(--terra);margin-left:6px;}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.2px;margin-right:4px;}

  /* stays */
  .stayblock{margin-bottom:16px;}
  .stayblock h3{margin:0 0 6px;font-size:15px;color:var(--teal);}
  .stayblock .why{font-size:12.5px;color:#3a4a52;margin:0 0 8px;line-height:1.45;}
  .stay{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer;border:1px solid transparent;}
  .stay.sel{border-color:var(--terra);}
  .stay .ph{width:64px;height:56px;border-radius:8px;flex:0 0 auto;background:linear-gradient(135deg,#efe6d6,#dccdb4);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative;}
  .stay .ph img{width:100%;height:100%;object-fit:cover;}
  .stay .ph .add{position:absolute;inset:auto 0 0 0;background:rgba(31,78,95,.75);color:#fff;font-size:8px;text-align:center;padding:2px;line-height:1.1;}
  .stay .b{flex:1;min-width:0;}
  .stay h4{margin:0;font-size:14px;}
  .stay .area{font-size:12px;color:var(--teal2);font-weight:600;}
  .stay p{margin:3px 0 0;font-size:12.5px;line-height:1.4;color:#3a4a52;}
  .band{float:right;font-size:12px;font-weight:800;color:var(--terra);}
  .st{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:4px;}
  .st.hot{background:#fdeeea;color:#c0392b;} .st.ok{background:#e9f5ea;color:#2E7D32;} .st.unk{background:#eef0f1;color:#5b6b71;} .st.pick{background:#efeafa;color:var(--eclipse);}

  /* logistics table */
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px;}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;}
  th{background:#f7f2e8;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:12px 13px;margin-bottom:10px;font-size:13px;line-height:1.5;}
  .card h3{margin:0 0 6px;font-size:14.5px;color:var(--teal);}
  .card ul{margin:4px 0 0 18px;padding:0;} .card li{margin-bottom:3px;}
  .big{font-size:30px;font-weight:800;color:var(--eclipse);letter-spacing:-.5px;}
  .tl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;}
  .tl b{color:var(--eclipse);}

  /* map pins */
  .pin{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #fff;
    width:28px;height:28px;border-radius:50%;font-size:12px;}
  .pin.small{width:20px;height:20px;font-size:10px;opacity:.9;}
  .pin.sel{outline:3px solid var(--terra);outline-offset:1px;}
  .leaflet-popup-content{font-size:12.5px;line-height:1.4;} .leaflet-popup-content b{color:var(--teal);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <h1>🌘 Spain 2027 · Eclipse at Tarifa → Basque Country</h1>
      <div class="sub">Sat 31 Jul → Wed 11 Aug 2027 · Travis &amp; Mike · totality Mon 2 Aug 10:45:07–10:49:47 CEST</div>
    </div>
    <nav class="tabs">
      <button class="active" data-v="itin">Itinerary</button>
      <button data-v="stays">Places to stay</button>
      <button data-v="eclipse">Eclipse</button>
      <button data-v="logi">Logistics</button>
      <button data-v="decide">Decisions</button>
    </nav>
  </header>
  <div id="main">
    <div id="left">
      <div id="v-itin" class="view active"></div>
      <div id="v-stays" class="view"></div>
      <div id="v-eclipse" class="view"></div>
      <div id="v-logi" class="view"></div>
      <div id="v-decide" class="view"></div>
    </div>
    <div id="right"><div id="map"></div></div>
  </div>
  <button class="mapbtn" id="mapbtn">🗺 Map</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

const days = [

     desc:"BA52 lands LHR 06:45 Sun; KL616 lands AMS 07:55 Sun. Premium economy is worth pricing (~$2.3–3.5k pp peak) — this is the sleep that protects Sunday. If the base is Gibraltar (Option B), BA continues LHR → GIB directly (06:10–13:55 departures, 2h50)."},

 { n:1, date:"Sun 1 Aug", title:"Land → Tarifa", base:"Tarifa", color:C.tarifa, ic:"🚐",

 { n:2, date:"Mon 2 Aug", title:"🌘 TOTAL SOLAR ECLIPSE", base:"Tarifa", color:C.tarifa, ic:"🌘",
   sum:"Partial 09:40:52 · TOTALITY 10:45:07 → 10:49:47 (max 10:47:27) · 4 m 40 s · partial ends 12:00:45. Sun ~38° up in the ESE. Decide the spot at dawn on the wind. Walk — never drive — this morning.",
   items:[
    {t:"06:30", ic:"🌬", title:"Wind check → pick the spot", place:"Hotel", ll:[36.0128,-5.6047], photo:"tarifa-dawn",
     desc:"Poniente / calm → Los Lances (south end). Strong Levante → Playa Chica / Punta causeway, sheltered by Isla de las Palomas. Fog forecast → pre-arranged driver east (Algeciras/Getares) or inland (Facinas)."},
    {t:"08:30", ic:"🏖", title:"Playa de los Lances (Plan A)", place:"South end, by port/castle", ll:[36.0180,-5.6130], photo:"tarifa-los-lances",

    {t:"08:30", ic:"🏝", title:"Playa Chica / Punta de Tarifa (Plan B)", place:"Causeway to Isla de las Palomas", ll:[36.0060,-5.6075], photo:"tarifa-playa-chica",

    {t:"Opt B", ic:"🇬🇮", title:"Gibraltar: Europa Point (4 m 29 s) / La Línea beach (4 m 23 s)", place:"Europa Point — bus 2 from town, or walk 40 min", ll:[36.1097,-5.3457], photo:"europa-point",

    {t:"16:00", ic:"🐋", title:"firmm whale & dolphin trip", place:"Tarifa harbour", ll:[36.0104,-5.6034], photo:"tarifa-whales", cost:"€50–70",

    {t:"21:00", ic:"🥂", title:"Celebration dinner", place:"Mandrágora / La Pescadería / Hurricane terrace", ll:[36.0128,-5.6060], photo:"tarifa-dinner",
     desc:"Castle is closed Mondays — save it for the morning of the 3rd if you want a look."},
   ]},
 { n:3, date:"Tue 3 Aug", title:"Tarifa → Málaga", base:"Málaga (Soho)", color:C.malaga, ic:"🚌",
   sum:"The whole coast leaves today — pre-book the move. Driver (1h45, optional Baelo Claudia stop) or bus via Algeciras. Málaga afternoon: Soho, Atarazanas, Alcazaba, Picasso, El Pimpi, Muelle Uno.",
   items:[
    {t:"Opt B/C", ic:"↔️", title:"From Gibraltar: La Línea → Algeciras (M-120, 40 min) → Avanza to Málaga (~2 h) · From Málaga base: you're already here", place:"", ll:[36.1650,-5.3480], photo:"la-linea-bus",

function selectMarker(key){

   <tr><td><b>C · Málaga (3 nights)</b></td><td>1:49 city / 3:10 Fuengirola by C-1</td><td>Easiest of all; no transfers; walk to Wed train</td><td>Best — thousands of rooms (still surging)</td></tr></table>
   <p style="margin:6px 0 0">My read: <b>try A this week; if nothing sane comes back, take B</b> — you keep 95 % of the totality and simplify the flights. C is the fallback that makes the whole trip trivially easy at the cost of ~1½ minutes and a crowded commuter train on eclipse morning.</p></div>
  <div class="card"><h3>1 · Leave Fri 30 Jul instead of Sat 31?</h3>With a Saturday departure you land Sunday midday and everything hinges on that itinerary running clean; the only buffer is the same day. Leaving Friday and sleeping in Málaga Saturday night (relaxed Sunday to Tarifa) is cheap insurance for a once-in-a-lifetime timed event, and gives Mike a bonus Málaga evening. Adds one hotel night; the north is unchanged. <b>Recommendation: Jul 30.</b></div>
  <div class="card"><h3>2 · Tarifa lodging ceiling</h3>What's the max per night you'll pay for the two eclipse nights? That decides whether the plan is "any Tarifa room with free cancellation" or "Zahara/Algeciras backup and be happy." Either way: email the shortlist directly this week.</div>
  <div class="card"><h3>3 · Málaga overnight vs straight through</h3>As written: sleep Málaga Tue, ride north Wed (one long, glorious train day). Alternative: Tarifa → Málaga → Madrid Tue and the 16:00/17:37 Alvia (SS 21:28 / Bilbao 22:28) — saves a hotel night, loses Mike's Málaga stop. <b>Kept Málaga.</b></div>
  <div class="card"><h3>4 · San Sebastián first, or Bilbao first?</h3>SS-first (as written) ends 25 min from the airport and puts Gernika's Monday market on Mon 9 Aug. Flip only if the Alvia isn't reaching Donostia in Aug 2027 (track works).</div>
  <div class="card"><h3>5 · Any splurge dinner?</h3>Elkano (Getaria) fits Fri 6 Aug naturally. Arzak needs a request 2–3 months out; Mugaritz is a taxi. Nerua (in the Guggenheim) for the last night?</div>
  <div class="card"><h3>6 · Premium economy on the transatlantic?</h3>~$900–1,500 pp more each way at peak. The outbound overnight is the sleep that protects Sunday's arrival; the return doesn't matter as much.</div>`;
