<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spain 2027 — Eclipse from Málaga → Basque Country</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{ --teal:#1F4E5F; --teal2:#2C7A8C; --terra:#C1660F; --gold:#C8902F; --sand:#FBF6EE; --ink:#243239;
    --muted:#6b7a80; --line:#ece3d4; --bg:#f4f1ea; --hike:#2E7D32; --night:#2b2340; --eclipse:#4b2a8a; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);}
  a{color:var(--teal2);}
  button{font-family:inherit;cursor:pointer;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  header{background:var(--teal);color:#fff;padding:12px 18px 0;flex:0 0 auto;}
  header .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  header h1{margin:0;font-size:19px;letter-spacing:.2px;}
  header .sub{font-size:12.5px;opacity:.85;}
  nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;}
  nav.tabs button{background:transparent;border:none;color:#fff;opacity:.72;padding:8px 12px;font-size:13.5px;font-weight:600;
    border-bottom:3px solid transparent;white-space:nowrap;}
  nav.tabs button.active{opacity:1;border-bottom-color:var(--gold);}
  #main{flex:1 1 auto;min-height:0;display:flex;}
  #left{flex:0 0 46%;max-width:620px;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 60px;}
  #right{flex:1 1 auto;position:relative;min-width:0;}
  #map{position:absolute;inset:0;}
  .mapbtn{display:none;}
  @media (max-width:860px){
    #main{flex-direction:column;}
    #left{flex:1 1 auto;max-width:none;}
    #right{flex:0 0 0;height:0;}
    #right.open{flex:0 0 42vh;height:42vh;}
    .mapbtn{display:inline-block;position:fixed;right:14px;bottom:14px;z-index:1200;background:var(--terra);color:#fff;border:none;
      border-radius:999px;padding:11px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  }
  .view{display:none;} .view.active{display:block;}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 2px 8px;font-weight:700;}
  .note{background:#fff8ea;border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:13.5px;line-height:1.5;margin:0 0 12px;}
  .note.red{background:#fdeeea;border-left-color:#c0392b;}
  .note.purple{background:#efeafa;border-left-color:var(--eclipse);}

  /* day cards */
  .day{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden;border:1px solid transparent;}
  .day.sel{border-color:var(--terra);}
  .dayhead{display:flex;gap:12px;align-items:center;padding:11px 13px;cursor:pointer;}
  .dayhead .num{width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto;}
  .dayhead .meta{flex:1;min-width:0;}
  .dayhead .d{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--terra);}
  .dayhead h3{margin:1px 0 2px;font-size:15.5px;color:var(--teal);line-height:1.15;}
  .dayhead .base{font-size:12px;color:var(--muted);}
  .dayhead .chev{color:#c4cccd;font-size:18px;transition:transform .2s;}
  .day.open .dayhead .chev{transform:rotate(90deg);}
  .daybody{display:none;padding:0 13px 12px;}
  .day.open .daybody{display:block;}
  .daysum{font-size:13.5px;line-height:1.5;margin:0 0 10px;color:#3a4a52;}
  .ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;}
  .ev:hover{background:#faf7f0;}
  .ev .ph{width:76px;height:64px;border-radius:9px;flex:0 0 auto;background:linear-gradient(135deg,#dfe6e6,#c9d6d8);display:flex;align-items:center;justify-content:center;
    font-size:26px;overflow:hidden;position:relative;}
  .ev .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .ev .ph .add{position:absolute;inset:auto 0 0 0;background:rgba(31,78,95,.75);color:#fff;font-size:8.5px;text-align:center;padding:2px 3px;line-height:1.1;}
  .ev .body{flex:1;min-width:0;}
  .ev .t{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .ev h4{margin:1px 0 2px;font-size:14px;color:var(--ink);}
  .ev .pl{font-size:12px;color:var(--teal2);font-weight:600;}
  .ev p{margin:3px 0 0;font-size:12.5px;line-height:1.45;color:#3a4a52;}
  .ev .cost{display:inline-block;background:#f1ece2;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;color:var(--terra);margin-left:6px;}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.2px;margin-right:4px;}

  /* stays */
  .stayblock{margin-bottom:16px;}
  .stayblock h3{margin:0 0 6px;font-size:15px;color:var(--teal);}
  .stayblock .why{font-size:12.5px;color:#3a4a52;margin:0 0 8px;line-height:1.45;}
  .stay{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer;border:1px solid transparent;}
  .stay.sel{border-color:var(--terra);}
  .stay .ph{width:64px;height:56px;border-radius:8px;flex:0 0 auto;background:linear-gradient(135deg,#efe6d6,#dccdb4);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative;}
  .stay .ph img{width:100%;height:100%;object-fit:cover;}
  .stay .ph .add{position:absolute;inset:auto 0 0 0;background:rgba(31,78,95,.75);color:#fff;font-size:8px;text-align:center;padding:2px;line-height:1.1;}
  .stay .b{flex:1;min-width:0;}
  .stay h4{margin:0;font-size:14px;}
  .stay .area{font-size:12px;color:var(--teal2);font-weight:600;}
  .stay p{margin:3px 0 0;font-size:12.5px;line-height:1.4;color:#3a4a52;}
  .band{float:right;font-size:12px;font-weight:800;color:var(--terra);}
  .st{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:4px;}
  .links{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;}
  .links a{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-size:11.5px;font-weight:700;border-radius:7px;padding:5px 9px;}
  .links a.alt{background:#eef0f1;color:var(--teal);}
  .links a:active{opacity:.8;}
  .st.hot{background:#fdeeea;color:#c0392b;} .st.ok{background:#e9f5ea;color:#2E7D32;} .st.unk{background:#eef0f1;color:#5b6b71;} .st.pick{background:#efeafa;color:var(--eclipse);}

  /* logistics table */
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px;}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;}
  th{background:#f7f2e8;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:12px 13px;margin-bottom:10px;font-size:13px;line-height:1.5;}
  .card h3{margin:0 0 6px;font-size:14.5px;color:var(--teal);}
  .card ul{margin:4px 0 0 18px;padding:0;} .card li{margin-bottom:3px;}
  .big{font-size:30px;font-weight:800;color:var(--eclipse);letter-spacing:-.5px;}
  .tl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;}
  .tl b{color:var(--eclipse);}

  /* map pins */
  .pin{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #fff;
    width:28px;height:28px;border-radius:50%;font-size:12px;}
  .pin.small{width:20px;height:20px;font-size:10px;opacity:.9;}
  .pin.sel{outline:3px solid var(--terra);outline-offset:1px;}
  .leaflet-popup-content{font-size:12.5px;line-height:1.4;} .leaflet-popup-content b{color:var(--teal);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <h1>🌘 Spain 2027 · Eclipse from Málaga → Basque Country</h1>
      <div class="sub">Sat 31 Jul → Wed 11 Aug 2027 · Travis &amp; Mike · totality Mon 2 Aug ~10:47 CEST (Fuengirola 3 m 10 s · Málaga 1 m 49 s)</div>
    </div>
    <nav class="tabs">
      <button class="active" data-v="itin">Itinerary</button>
      <button data-v="stays">Places to stay</button>
      <button data-v="eclipse">Eclipse</button>
      <button data-v="logi">Logistics</button>
      <button data-v="decide">Decisions</button>
    </nav>
  </header>
  <div id="main">
    <div id="left">
      <div id="v-itin" class="view active"></div>
      <div id="v-stays" class="view"></div>
      <div id="v-eclipse" class="view"></div>
      <div id="v-logi" class="view"></div>
      <div id="v-decide" class="view"></div>
    </div>
    <div id="right"><div id="map"></div></div>
  </div>
  <button class="mapbtn" id="mapbtn">🗺 Map</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ------------------------------------------------------------------

const PHOTO_DIR = "photos/";
const C = { fly:"#5b6b71", tarifa:"#4b2a8a", malaga:"#C1660F", train:"#1F4E5F", ss:"#2C7A8C", bilbao:"#2E7D32" };

const days = [

   items:[

     desc:"BA52 lands LHR 06:45 Sun; KL616 lands AMS 07:55 Sun. Premium economy is worth pricing (~$2.3–3.5k pp peak) — this is the sleep that protects Sunday."},

 { n:1, date:"Sun 1 Aug", title:"Land Málaga → settle in", base:"Málaga (Soho / old town)", color:C.malaga, ic:"🛬",

    {t:"~13:00", ic:"🚕", title:"Taxi or Cercanías C-1 to the hotel", place:"Airport → Soho / María Zambrano, 12–15 min", ll:[36.7160,-4.4245], photo:"malaga-arrival", cost:"€25 taxi / €2 train",
     desc:"The C-1 platform is under the terminal (every 20 min). Check in; the same line is tomorrow's eclipse train."},
    {t:"16:00", ic:"🎨", title:"Soho street art → Atarazanas → the sea", place:"Calle Casas de Campos → Mercado de Atarazanas → Muelle Uno", ll:[36.7175,-4.4237], photo:"malaga-atarazanas",
     desc:"Obey/D*Face murals; the market's 14th-c. Moorish gate (it closes ~15:00 Sun — save the inside for Tue). Then the port and the Pompidou cube."},
    {t:"18:30", ic:"🚉", title:"Scout: Centro-Alameda station + C-1 timetable", place:"Cercanías Centro-Alameda (Soho)", ll:[36.7186,-4.4230], photo:"centro-alameda",
     desc:"Find the entrance, buy/load a Renfe Cercanías card, note the first trains (~05:30–06:00) and the every-20-min pattern. Tomorrow you want to be on a train by 08:00 at the latest."},

   ]},
 { n:2, date:"Mon 2 Aug", title:"🌘 TOTAL SOLAR ECLIPSE — Fuengirola", base:"Málaga", color:C.tarifa, ic:"🌘",
   sum:"Cercanías C-1 west to Fuengirola (45 min) for 3 m 10 s of totality on the beach: partial 09:41:43 · TOTALITY 10:47:03 → 10:50:13 · partial ends 12:02:09. Sun ~38° up in the ESE, over the sea. Staying in Málaga city would give only 1 m 49 s (10:48:02 → 10:49:51) — the train nearly doubles it.",

    {t:"07:20", ic:"🚆", title:"Cercanías C-1 → Fuengirola", place:"Centro-Alameda (or María Zambrano) → Fuengirola, 45 min, every 20 min", ll:[36.7186,-4.4230], photo:"c1-train", cost:"~€3.60",
     desc:"Take the 07:20-ish or 07:40 — later trains will be jammed with everyone who had the same idea. If Fuengirola looks mobbed on arrival, Los Boliches (one stop earlier) has the same beach and 3 m 05 s."},
    {t:"08:15", ic:"🏖", title:"Pick the spot on Fuengirola beach", place:"Playa de los Boliches / Playa de Fuengirola — 2 min from the station", ll:[36.5420,-4.6200], photo:"fuengirola-beach",
     desc:"7 km of straight beach facing SE — the Sun will be over the water, ~38° up. Walk south toward Castillo Sohail for a quieter stretch and a foreground; the promenade has cafés and shade for the 2-hour partial phase."},
    {t:"09:41:43", ic:"🌗", title:"First contact — partial begins", place:"Fuengirola", ll:[36.5397,-4.6242], photo:"partial-phase",

    {t:"10:47:03", ic:"🌑", title:"TOTALITY — 3 min 10 s", place:"Look ESE, ~38° up, over the sea", ll:[36.5397,-4.6242], photo:"totality",

    {t:"~15:00", ic:"🚆", title:"C-1 back to Málaga (or linger)", place:"Fuengirola → Centro-Alameda", ll:[36.5397,-4.6242], photo:"c1-return",

     desc:"Totality 10:48:02 → 10:49:51. Real, but short — the train is worth it."},

 { n:3, date:"Tue 3 Aug", title:"Málaga day — Mike's stop", base:"Málaga", color:C.malaga, ic:"🏰",

   items:[

     desc:"14th-c. Moorish gate, stained glass, fish hall; tapas + a beer at the bar counters before noon."},
    {t:"opt.", ic:"🥾", title:"Or: Caminito del Rey", place:"Cercanías C-2 → El Chorro (~45 min) + shuttle to the north entrance", ll:[36.9155,-4.7770], photo:"caminito", cost:"€10–18",
     desc:"The gorge boardwalk. Book on caminitodelrey.info the moment dates open — it sells out. Back in Málaga by mid-afternoon."},
    {t:"11:00", ic:"🖼", title:"Museo Picasso Málaga", place:"Calle San Agustín", ll:[36.7218,-4.4183], photo:"picasso-museum", cost:"€13",

    {t:"17:00", ic:"🏰", title:"Roman Theatre + Alcazaba", place:"Calle Alcazabilla", ll:[36.7213,-4.4155], photo:"malaga-alcazaba", cost:"€3.50",

    {t:"19:30", ic:"🍷", title:"El Pimpi → Muelle Uno sunset", place:"Calle Granada → port", ll:[36.7195,-4.4160], photo:"malaga-el-pimpi",

    {t:"21:00", ic:"🍽", title:"Dinner + pack", place:"Whichever of Cervantes / Cosmopolita you haven't done", ll:[36.7238,-4.4185], photo:"malaga-dinner",

   ]},
 { n:4, date:"Wed 4 Aug", title:"🚄 The big train day → San Sebastián", base:"San Sebastián (Gros)", color:C.train, ic:"🚄",

   items:[
    {t:"08:09", ic:"🚄", title:"Iryo Málaga → Madrid Atocha", place:"María Zambrano → Puerta de Atocha, 2h47", ll:[36.7115,-4.4319], photo:"iryo-car3", cost:"€40–90",

    {t:"10:56", ic:"🚉", title:"Atocha → Chamartín (Cercanías C-1/C-10)", place:"Madrid", ll:[40.4066,-3.6895], photo:"madrid-atocha",

 { n:5, date:"Thu 5 Aug", title:"San Sebastián — the classic loop", base:"San Sebastián", color:C.ss, ic:"🌊",

const markers = {}; // key -> marker
function pin(ll, color, txt, small, popup, key){
  const m = L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="pin ${small?'small':''}" style="background:${color}">${txt}</div>`,iconSize:[small?20:28,small?20:28],iconAnchor:[small?10:14,small?10:14]})}).addTo(map);
  if(popup) m.bindPopup(popup);
  if(key) markers[key]=m;
  return m;
}

function focusLL(ll, z){ lastView=()=>map.setView(ll, z||13, {animate:true}); applyView(); }
function selectMarker(key){
  Object.values(markers).forEach(m=>{ const el=m.getElement(); if(el){ const p=el.querySelector('.pin'); p&&p.classList.remove('sel'); }});
  const m=markers[key]; if(m){ const el=m.getElement(); if(el){ const p=el.querySelector('.pin'); p&&p.classList.add('sel'); } m.openPopup(); }
}
function fitDay(d){
  const b=L.latLngBounds(d.items.map(i=>i.ll)); lastView=()=>map.fitBounds(b.pad(0.4),{animate:true,maxZoom:14}); applyView();
}

function photoBox(slug, ic, cls){
  const src = PHOTO_DIR + slug + ".jpg";
  return `<div class="ph ${cls||''}"><span class="emo">${ic||'📷'}</span><img src="${src}" alt="" style="display:none" onload="this.style.display='block';this.previousElementSibling.style.display='none';this.nextElementSibling.style.display='none'" onerror="this.remove()"><span class="add">add ${slug}.jpg</span></div>`;
}
function renderItin(){
  const v=document.getElementById('v-itin');
  let h=`<div class="note purple"><b>Fixed point:</b> Mon 2 Aug, Costa del Sol — from Fuengirola (45 min by Cercanías from Málaga) totality <b>10:47:03 → 10:50:13</b> CEST (3 m 10 s); from Málaga city 10:48:02 → 10:49:51 (1 m 49 s). Sun ~38° up in the ESE, over the sea. Everything else bends around that. Tap a day to expand; tap an item to jump the map. Photos slot in automatically once dropped into <code>photos/eclipse/</code>.</div>`;
  h+=`<div class="note red"><b>Book first:</b> Málaga hotel ×3 (Sun 1 – Tue 3 Aug) with free cancellation — now — then flights (Alaska/Delta load 31 Jul 2027 ~3 Sep 2026; BA/Iberia/KLM already open).</div>`;
  days.forEach(d=>{
    h+=`<div class="day" id="day-${d.n}"><div class="dayhead" onclick="toggleDay(${d.n})">
      <div class="num" style="background:${d.color}">${d.n}</div>
      <div class="meta"><div class="d">Day ${d.n} · ${d.date}</div><h3>${d.ic} ${d.title}</h3><div class="base">🛌 ${d.base}</div></div>
      <div class="chev">›</div></div>
      <div class="daybody"><p class="daysum">${d.sum}</p>`;
    d.items.forEach((it,i)=>{
      h+=`<div class="ev" onclick="event.stopPropagation();pick('d${d.n}-${i}',[${it.ll}])">${photoBox(it.photo,it.ic)}
        <div class="body"><div class="t">${it.t}</div><h4>${it.title}${it.cost?`<span class="cost">${it.cost}</span>`:''}</h4><div class="pl">${it.place}</div><p>${it.desc}</p></div></div>`;
    });
    h+=`</div></div>`;
  });
  v.innerHTML=h;
}
function toggleDay(n){
  const el=document.getElementById('day-'+n); const open=el.classList.contains('open');
  document.querySelectorAll('.day').forEach(x=>x.classList.remove('open','sel'));
  if(!open){ el.classList.add('open','sel'); fitDay(days.find(d=>d.n===n)); el.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function pick(key, ll){ selectMarker(key); if(window.innerWidth<=860){ document.getElementById('right').classList.add('open'); } setTimeout(()=>focusLL(ll, 13),80); }

function renderStays(){
  const v=document.getElementById('v-stays');
  let h=`<div class="note">Bands are indicative <b>normal-season</b> rates from 2026 research; nothing here is booked. <b>Website ↗</b> goes to the hotel's own site (book 1:1, skip the OTAs). Tap a card to see it on the map. Status tags reflect what was visible in Aug 2026 — re-check before booking. Full notes: <code>04_Planning/Research/</code>.</div>`;
  stays.forEach(g=>{
    h+=`<div class="stayblock"><h3>${g.city}</h3><p class="why">${g.why}</p>`;
    g.list.forEach((s,i)=>{
      h+=`<div class="stay" onclick="pickStay('${g.key}',${i})">${photoBox(s.photo,'🛏')}
        <div class="b"><span class="band">${s.band}</span><h4>${s.name}</h4><div class="area">${s.area}</div><p>${s.why}</p><span class="st ${s.st}">${s.stt}</span>
        <div class="links" onclick="event.stopPropagation()">${s.url?`<a href="${s.url}" target="_blank" rel="noopener">Website ↗</a>`:''}${(s.links||[]).map(l=>`<a class="alt" href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}<a class="alt" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name.replace(/^(BACKUP|Getxo option) · /,'').split(' / ')[0]+' '+g.city.split(' ·')[0])}" target="_blank" rel="noopener">Map ↗</a></div></div></div>`;
    });
    h+=`</div>`;
  });
  v.innerHTML=h;
}
function pickStay(key,i){ const g=stays.find(x=>x.key===key); const s=g.list[i]; document.querySelectorAll('.stay').forEach(x=>x.classList.remove('sel')); event.currentTarget.classList.add('sel'); pick(`s-${key}-${i}`, s.ll); }

function renderDecide(){
  document.getElementById('v-decide').innerHTML=`
  <div class="card"><h3>✅ 0 · Eclipse base — DECIDED: Málaga</h3>Three nights in Málaga (Sun 1 – Tue 3 Aug), Cercanías C-1 to Fuengirola on eclipse morning for 3 m 10 s. Considered and set aside: Tarifa (4 m 40 s but sold out a year ahead, transfers both ways) and Gibraltar/La Línea (4 m 23–29 s, direct BA flight, tight rooms). The trade: ~1½ minutes of totality for zero transfers, real hotel availability, and a full bonus Málaga day. Notes on the other two live in <code>04_Planning/Research/01_Eclipse_Tarifa.md</code>.</div>
  <div class="card"><h3>1 · Leave Fri 30 Jul instead of Sat 31?</h3>With a Saturday departure you land Sunday midday and have a full day's margin before Monday's 07:20 train — comfortable, unless the transatlantic leg goes badly wrong. Leaving Friday adds a fourth Málaga night as insurance and a lazier arrival. Now that the base is Málaga (no onward transfer), the case for Friday is weaker than it was — <b>Sat 31 Jul is fine; Fri 30 Jul if you want belt-and-braces.</b></div>
  <div class="card"><h3>2 · Málaga hotel — which and how much?</h3>Book three nights now with free cancellation (eclipse-week prices are inflated and will move). Soho Boutique Equitativa / Room Mate Valeria are the value picks near Centro-Alameda; Only YOU / Molina Lario if you want a rooftop pool; the Barceló in the station if you want zero-friction mornings. What's your ceiling per night?</div>
  <div class="card"><h3>3 · Tue 3 Aug: Málaga day or Caminito del Rey?</h3>Both are on the card. Caminito is a Cercanías C-2 ride to El Chorro + shuttle, back by mid-afternoon — but it sells out fast (caminitodelrey.info) and eats the Atarazanas/Picasso morning. Decide when tickets open.</div>
